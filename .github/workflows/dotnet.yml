name: LS Monitoring CI

# Build and test on every push to main and on pull requests. Releases live in release.yml (tag ls-v*).
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: ./global.json

      - name: Restore
        run: dotnet restore LsMonitoring.sln

      - name: Build
        run: dotnet build LsMonitoring.sln --no-restore -c Release

      - name: Test
        run: dotnet test LsMonitoring.sln --no-build -c Release

      - name: Vulnerability scan
        # Fails the build if any package has a known CVE. windows-latest defaults to pwsh, so use
        # PowerShell and parse JSON (locale-independent — the plain-text output is localized to the
        # runner culture). In the JSON report a clean project has only a "path" key; an affected
        # project gains a "frameworks" array listing the vulnerable packages.
        shell: pwsh
        run: |
          $json = dotnet list package --vulnerable --include-transitive --format json | Out-String
          Write-Host $json
          $report = $json | ConvertFrom-Json
          $vulnerable = @($report.projects | Where-Object { $_.PSObject.Properties.Name -contains 'frameworks' })
          if ($vulnerable.Count -gt 0) {
            Write-Error "Vulnerable packages detected in: $($vulnerable.path -join ', ')"
            exit 1
          }
